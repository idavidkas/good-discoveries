<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Редакция — Хорошие открытия</title><link rel="stylesheet" href="/assets/admin.css"><script defer src="/assets/admin.js"></script></head><body><div class="wrap"><header><a href="/">✳ хорошие<span>открытия</span></a><p>Редакторская панель</p></header><section id="auth" class="auth card"><h1>Вход в редакцию</h1><p>Для публикации нужна проверка оригинального исследования. Введите серверный ADMIN_TOKEN — он не сохраняется в браузере.</p><form id="login-form"><input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN" required><button>Войти</button></form><p id="auth-error" class="error"></p></section><section id="dashboard" hidden><div class="heading"><div><h1>Ручная проверка</h1><p>Новые кандидаты из рецензируемых журналов. Публикуй только после проверки первоисточника.</p></div><div class="actions"><button id="refresh-feed">Проверить источники</button><button id="manual-new" class="secondary">Добавить по DOI</button><button id="logout" class="ghost">Выйти</button></div></div><p id="message" class="message"></p><div id="candidates" class="candidates"></div><section id="edit-box" class="card" hidden><div class="edit-head"><h2 id="edit-title">Публикация</h2><button id="cancel-edit" class="ghost" type="button">Отмена ×</button></div><form id="article-form"><div class="field-grid"><label>DOI<input name="doi" required readonly></label><label>Дата публикации<input name="published_at" type="date" required readonly></label><label>Журнал / источник<input name="source" required readonly></label><label>Категория<select name="category"><option>Медицина</option><option>Природа</option><option>Физика</option><option>Технологии</option><option>Космос</option><option>Биология</option></select></label></div><label>Заголовок на русском<input name="title" minlength="10" required placeholder="Что именно удалось доказать"></label><label>Краткое вступление<textarea name="lead" minlength="25" rows="2" required></textarea></label><label>Подробный текст<textarea name="body" minlength="40" rows="5" required></textarea></label><label>Ограничения исследования<textarea name="limitations" minlength="10" rows="2" required></textarea></label><label>Уровень доказательности<input name="evidence" minlength="6" value="Рецензируемое исследование" required></label><div class="actions"><button type="submit">Опубликовать</button><button id="reject-edit" class="reject" type="button">Отклонить</button></div></form></section></section></div></body></html>
