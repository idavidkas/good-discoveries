<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09191b">
  <meta name="description" content="Хорошие открытия — только позитивные новости науки с проверяемыми первоисточниками и честными ограничениями исследований.">
  <meta property="og:title" content="Хорошие открытия — наука, которая радует">
  <meta property="og:description" content="Одна хорошая научная новость за раз. Без шума, кликбейта и сомнительных сенсаций.">
  <title>Хорошие открытия — наука, которая радует</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="./assets/config.js"></script>
  <script src="./assets/app.js" defer></script>
  <script src="./assets/pwa.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Хорошие открытия — на главную">
        <span class="brand-icon" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="4" fill="currentColor"/><ellipse cx="15" cy="15" rx="12" ry="5.6" stroke="currentColor" stroke-width="1.6" transform="rotate(55 15 15)"/><ellipse cx="15" cy="15" rx="12" ry="5.6" stroke="currentColor" stroke-width="1.6" transform="rotate(-55 15 15)"/><circle cx="23.6" cy="20.5" r="2.2" fill="#F0D28C"/></svg>
        </span>
        <span class="brand-label">хорошие<span>открытия</span><small>СВЕТЛАЯ СТОРОНА НАУКИ</small></span>
      </a>
      <div class="topbar-right">
        <div class="live-indicator"><span class="live-dot"></span><span>Лента обновляется</span></div>
        <span class="topbar-divider"></span>
        <span class="time-badge" id="clock">МОСКВА · —</span>
      </div>
    </header>

    <main>
      <section id="main-story" class="story-panel" aria-label="Главная научная новость" aria-live="polite">
        <div class="loading-card"><div class="loading-shimmer"></div><p>Загружаем хорошую новость…</p></div>
      </section>

      <div class="pwa-controls" aria-label="Установка и подписка">
        <button id="install-app" type="button" class="pwa-button">↗ Установить приложение</button>
        <button id="push-toggle" type="button" class="pwa-button pwa-button-primary">♧ Дайджест каждые 3 дня</button>
        <span id="pwa-message" class="pwa-message" role="status" aria-live="polite"></span>
      </div>

      <section class="archive" aria-label="Предыдущие открытия">
        <div class="section-heading archive-heading"><div class="section-heading-left"><span class="section-num">02</span><h2>Предыдущие открытия</h2><span class="section-line"></span></div><div class="archive-label"><span id="archive-count">0</span> В АРХИВЕ <span class="desktop-only">· НАВЕДИ ИЛИ НАЖМИ</span></div></div>
        <div class="archive-strip" id="archive-strip"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-note"><span class="footer-mark" aria-hidden="true">✳</span><span>Если новых проверенных открытий нет — предыдущая новость остаётся на месте. И это нормально.</span></div>
      <div class="footer-status"><span id="refresh-status">Проверяем источники</span><span class="footer-sep">·</span><button id="info-btn" class="footer-info" type="button">Как мы отбираем новости <span aria-hidden="true">↗</span></button></div>
    </footer>
  </div>

  <div id="modal" class="modal" hidden aria-hidden="true"><div class="modal-backdrop" data-close="true"></div><div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close" id="modal-close" type="button" aria-label="Закрыть окно">×</button><div class="modal-content" id="modal-content"></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
