stages:
  - test
  - deploy

backend-tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --disable-pip-version-check -r requirements.txt pytest
    - pytest -q
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  stage: deploy
  image: python:3.12-alpine
  script:
    - python scripts/build_pages.py
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: $CI_PAGES_URL
